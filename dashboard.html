<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>No.sメ | Gaming Control Center</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #02060b;
            --panel: #07111c;
            --panel2: #0a1724;
            --blue: #00aaff;
            --blue2: #006eff;
            --cyan: #24c5ff;
            --green: #00d084;
            --yellow: #ffc857;
            --red: #ff5969;
            --text: #f4f8fc;
            --muted: #71879a;
            --border: rgba(0, 170, 255, .16);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 70% 0%,
                    rgba(0, 119, 255, .16),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(0, 170, 255, .06),
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    #02050a,
                    #06111d 55%,
                    #02050a
                );

            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .35;

            background-image:
                linear-gradient(
                    rgba(0, 170, 255, .025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 170, 255, .025) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;
        }


        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 70px;

            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 26px;

            background: rgba(3, 9, 16, .94);
            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(18px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;

            text-shadow:
                0 0 10px rgba(0, 170, 255, .8),
                0 0 30px rgba(0, 170, 255, .3);
        }

        .brand-details strong {
            display: block;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .brand-details small {
            display: block;
            margin-top: 4px;
            color: var(--blue);
            font-size: 8px;
            letter-spacing: 2px;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .clock {
            color: #8195a7;
            font-size: 11px;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #8ba0b2;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .online-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;
            background: var(--green);

            box-shadow:
                0 0 8px var(--green),
                0 0 16px rgba(0, 208, 132, .4);
        }


        /* =========================
           MAIN LAYOUT
        ========================= */

        .layout {
            min-height: calc(100vh - 70px);
            display: flex;
            position: relative;
            z-index: 2;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 235px;
            flex-shrink: 0;

            padding: 22px 14px;

            background: rgba(3, 10, 17, .82);
            border-right: 1px solid var(--border);
        }

        .menu-label {
            padding: 7px 13px;

            color: #4e6579;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-btn {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 13px;

            padding: 12px 14px;
            margin: 3px 0;

            border: 1px solid transparent;
            border-radius: 9px;

            background: transparent;
            color: #7890a4;

            cursor: pointer;
            text-align: left;

            transition: .2s ease;
        }

        .nav-btn:hover {
            color: #fff;
            background: rgba(0, 145, 255, .06);
            border-color: rgba(0, 170, 255, .1);
        }

        .nav-btn.active {
            color: #fff;

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 130, 255, .15),
                    rgba(0, 130, 255, .035)
                );

            border-color: rgba(0, 170, 255, .22);

            box-shadow:
                inset 3px 0 0 var(--blue),
                0 0 20px rgba(0, 130, 255, .04);
        }

        .nav-icon {
            width: 23px;
            text-align: center;
            color: var(--blue);
            font-size: 15px;
        }

        .sidebar-divider {
            height: 1px;
            margin: 20px 8px;

            background: rgba(255,255,255,.05);
        }

        .safe-card {
            margin-top: 24px;
            padding: 14px;

            border-radius: 10px;

            background: rgba(0, 145, 255, .035);
            border: 1px solid rgba(0, 170, 255, .11);
        }

        .safe-card-title {
            color: #a6b9c9;
            font-size: 10px;
            font-weight: bold;
        }

        .safe-card p {
            margin-top: 7px;

            color: #5f7588;
            font-size: 9px;
            line-height: 1.6;
        }

        .logout-btn {
            width: 100%;

            margin-top: 13px;
            padding: 9px;

            border-radius: 7px;

            border: 1px solid rgba(255, 80, 100, .16);
            background: rgba(255, 60, 80, .035);

            color: #ff7482;

            font-size: 9px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: rgba(255, 60, 80, .08);
        }


        /* =========================
           CONTENT
        ========================= */

        .content {
            flex: 1;
            min-width: 0;

            padding: 30px;
        }

        .page {
            display: none;
            animation: pageIn .25s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heading {
            margin-bottom: 24px;
        }

        .heading h1 {
            font-size: 27px;
            letter-spacing: -.5px;
        }

        .heading p {
            margin-top: 7px;
            color: var(--muted);
            font-size: 11px;
        }


        /* =========================
           STAT CARDS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 13px;

            margin-bottom: 18px;
        }

        .stat-card {
            padding: 18px;

            border-radius: 11px;

            background: rgba(7, 17, 29, .82);
            border: 1px solid var(--border);

            transition: .2s ease;
        }

        .stat-card:hover {
            border-color: rgba(0, 170, 255, .28);
            transform: translateY(-2px);
        }

        .stat-label {
            color: #61788c;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stat-value {
            margin-top: 9px;
            font-size: 24px;
            font-weight: 800;
        }

        .blue {
            color: var(--cyan);
        }

        .green {
            color: var(--green);
        }


        /* =========================
           MAIN CARDS
        ========================= */

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 18px;
        }

        .card {
            padding: 21px;

            border-radius: 13px;

            background: rgba(7, 17, 29, .84);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
        }

        .card-subtitle {
            margin-top: 5px;
            margin-bottom: 20px;

            color: #61788c;
            font-size: 10px;
        }


        /* =========================
           PERFORMANCE
        ========================= */

        .performance {
            text-align: center;
        }

        .performance-circle {
            width: 155px;
            height: 155px;

            margin: 12px auto 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            border: 2px solid #008cff;

            box-shadow:
                0 0 28px rgba(0, 140, 255, .15),
                inset 0 0 28px rgba(0, 140, 255, .06);
        }

        .performance-circle strong {
            font-size: 34px;
        }

        .performance-circle span {
            margin-top: 4px;
            color: #657c90;
            font-size: 9px;
            letter-spacing: 1px;
        }

        .primary-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue2),
                    #00b7ff
                );

            color: white;

            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(0, 120, 255, .18);

            transition: .2s ease;
        }

        .primary-btn:hover {
            filter: brightness(1.12);
            transform: translateY(-1px);
        }

        .secondary-btn {
            width: 100%;

            margin-top: 9px;
            padding: 12px;

            border-radius: 8px;

            border: 1px solid rgba(0, 170, 255, .16);

            background: rgba(0, 130, 255, .04);

            color: #7fa1ba;

            font-size: 10px;
            cursor: pointer;
        }

        .secondary-btn:hover {
            color: white;
            border-color: rgba(0, 170, 255, .3);
        }


        /* =========================
           CHECKLIST
        ========================= */

        .check {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 13px 0;

            border-bottom: 1px solid rgba(255,255,255,.05);
        }

        .check:last-child {
            border-bottom: none;
        }

        .check strong {
            display: block;
            font-size: 11px;
        }

        .check span {
            display: block;
            margin-top: 4px;

            color: #60778b;
            font-size: 9px;
        }

        .badge {
            padding: 5px 8px;

            border-radius: 5px;

            color: var(--green);
            background: rgba(0, 208, 132, .06);
            border: 1px solid rgba(0, 208, 132, .12);

            font-size: 8px;
        }


        /* =========================
           GAME MODE
        ========================= */

        .setting {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 16px 0;

            border-bottom: 1px solid rgba(255,255,255,.05);
        }

        .setting:last-child {
            border-bottom: none;
        }

        .setting strong {
            display: block;
            font-size: 11px;
        }

        .setting span {
            display: block;
            margin-top: 4px;

            color: #60778b;
            font-size: 9px;
        }

        select {
            min-width: 130px;

            padding: 8px 10px;

            color: white;
            background: #050d16;

            border: 1px solid #1b3449;
            border-radius: 7px;

            outline: none;
        }


        /* =========================
           SENSITIVITY
        ========================= */

        .sensitivity-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .sense-item {
            padding: 15px;

            border-radius: 9px;

            background: #050d16;
            border: 1px solid rgba(0,170,255,.1);
        }

        .sense-top {
            display: flex;
            justify-content: space-between;

            margin-bottom: 9px;

            font-size: 10px;
        }

        .sense-value {
            color: var(--blue);
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--blue);
        }


        /* =========================
           DEVICE INFO
        ========================= */

        .device-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .device-box {
            padding: 17px;

            border-radius: 9px;

            background: #050d16;
            border: 1px solid rgba(0,170,255,.1);
        }

        .device-box small {
            color: #60778b;
            font-size: 9px;
        }

        .device-box strong {
            display: block;
            margin-top: 8px;
            color: var(--cyan);
            font-size: 15px;
        }


        /* =========================
           PERFORMANCE TEST
        ========================= */

        .test-center {
            text-align: center;
        }

        .test-score {
            width: 155px;
            height: 155px;

            margin: 10px auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            border: 2px solid #008cff;

            font-size: 32px;
            font-weight: bold;

            box-shadow:
                0 0 25px rgba(0,140,255,.13);
        }

        .test-message {
            margin-top: 14px;

            color: #61788c;
            font-size: 9px;
            line-height: 1.5;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1000px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 700px) {

            .topbar {
                height: 62px;
                padding: 0 15px;
            }

            .brand-details {
                display: none;
            }

            .clock {
                display: none;
            }

            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;

                display: flex;
                overflow-x: auto;

                padding: 7px;

                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .menu-label,
            .safe-card,
            .sidebar-divider {
                display: none;
            }

            .nav-btn {
                min-width: 92px;

                justify-content: center;
                flex-direction: column;

                gap: 4px;

                padding: 8px 5px;

                font-size: 8px;
                text-align: center;
            }

            .nav-icon {
                font-size: 14px;
            }

            .content {
                padding: 18px 14px;
            }

            .heading h1 {
                font-size: 23px;
            }

            .stats {
                gap: 9px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-value {
                font-size: 20px;
            }

            .sensitivity-grid {
                grid-template-columns: 1fr;
            }

            .device-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 420px) {

            .system-status {
                display: none;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .stat-value {
                font-size: 18px;
            }

            .setting {
                align-items: flex-start;
                gap: 12px;
                flex-direction: column;
            }

            select {
                width: 100%;
            }

        }

    </style>
</head>


<body>


<!-- =====================================
     TOP BAR
===================================== -->

<header class="topbar">

    <div class="brand">

        <div class="brand-logo">
            No.sメ
        </div>

        <div class="brand-details">
            <strong>GAMING MODE</strong>
            <small>CONTROL CENTER</small>
        </div>

    </div>


    <div class="top-right">

        <div class="clock" id="clock">
            --:--:--
        </div>

        <div class="system-status">
            <span class="online-dot"></span>
            SYSTEM ONLINE
        </div>

    </div>

</header>



<!-- =====================================
     MAIN LAYOUT
===================================== -->

<div class="layout">


    <!-- =================================
         SIDEBAR
    ================================== -->

    <aside class="sidebar">

        <div class="menu-label">
            Main Menu
        </div>


        <button class="nav-btn active"
                data-page="home">

            <span class="nav-icon">⌂</span>
            HOME

        </button>


        <button class="nav-btn"
                data-page="game">

            <span class="nav-icon">◈</span>
            GAME MODE

        </button>


        <button class="nav-btn"
                data-page="boost">

            <span class="nav-icon">⚡</span>
            BOOST

        </button>


        <button class="nav-btn"
                data-page="sensitivity">

            <span class="nav-icon">⌁</span>
            SENSITIVITY

        </button>


        <button class="nav-btn"
                data-page="device">

            <span class="nav-icon">▣</span>
            DEVICE

        </button>


        <button class="nav-btn"
                data-page="test">

            <span class="nav-icon">◫</span>
            PERFORMANCE

        </button>


        <button class="nav-btn"
                data-page="settings">

            <span class="nav-icon">⚙</span>
            SETTINGS

        </button>


        <div class="sidebar-divider"></div>
