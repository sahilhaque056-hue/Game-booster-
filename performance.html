<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NO.S X | Performance Center</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 80% 10%,rgba(255,0,45,.15),transparent 30%),
        radial-gradient(circle at 10% 90%,rgba(255,0,30,.08),transparent 35%),
        #050505;
}

/* GRID */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.18;
    background-image:
        linear-gradient(rgba(255,0,40,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,0,40,.08) 1px,transparent 1px);
    background-size:45px 45px;
}

/* HEADER */
.header{
    height:75px;
    padding:0 35px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #252525;
    background:rgba(5,5,5,.9);
    position:relative;
    z-index:2;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#ff1744;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.status{
    padding:8px 13px;
    border:1px solid #ff1744;
    color:#ff3158;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
}

.back-btn{
    border:1px solid #333;
    background:#111;
    color:#fff;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    transition:.25s;
}

.back-btn:hover{
    border-color:#ff1744;
    color:#ff1744;
}

/* MAIN */
.container{
    max-width:1250px;
    margin:auto;
    padding:35px 25px 60px;
    position:relative;
    z-index:1;
}

.title-area{
    margin-bottom:30px;
}

.title-area h1{
    font-size:34px;
    letter-spacing:1px;
}

.title-area h1 span{
    color:#ff1744;
}

.title-area p{
    margin-top:8px;
    color:#777;
}

/* PROFILE */
.profile{
    padding:20px;
    border:1px solid #292929;
    background:linear-gradient(145deg,#101010,#080808);
    border-radius:12px;
    margin-bottom:25px;
}

.profile-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.game-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.game-icon{
    width:58px;
    height:58px;
    display:grid;
    place-items:center;
    font-size:28px;
    border-radius:10px;
    background:#171717;
    border:1px solid #ff1744;
    box-shadow:0 0 20px rgba(255,0,50,.15);
}

.game-info h2{
    font-size:20px;
}

.game-info p{
    color:#666;
    margin-top:5px;
    font-size:12px;
}

.profile-badge{
    color:#ff1744;
    border:1px solid #ff1744;
    padding:8px 12px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

/* CARD */
.card{
    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:12px;
    padding:22px;
    transition:.25s;
}

.card:hover{
    border-color:#ff1744;
    box-shadow:0 0 25px rgba(255,0,50,.08);
}

.card h3{
    font-size:15px;
    margin-bottom:5px;
}

.card-description{
    color:#666;
    font-size:11px;
    margin-bottom:20px;
}

/* OPTIONS */
.options{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.option{
    padding:13px 5px;
    text-align:center;
    border:1px solid #292929;
    background:#111;
    color:#aaa;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
    transition:.2s;
}

.option:hover{
    border-color:#ff1744;
    color:#fff;
}

.option.active{
    background:#ff1744;
    color:#fff;
    border-color:#ff1744;
    box-shadow:0 0 15px rgba(255,0,50,.25);
}

/* PERFORMANCE MODES */
.modes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.mode{
    padding:15px 8px;
    text-align:center;
    background:#111;
    border:1px solid #292929;
    border-radius:7px;
    cursor:pointer;
}

.mode strong{
    display:block;
    font-size:12px;
}

.mode small{
    color:#666;
    display:block;
    margin-top:5px;
    font-size:9px;
}

.mode.active{
    border-color:#ff1744;
    box-shadow:inset 0 0 20px rgba(255,0,50,.08);
}

.mode.active strong{
    color:#ff1744;
}

/* SLIDER */
.slider-box{
    margin-top:10px;
}

.slider-header{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#aaa;
    margin-bottom:10px;
}

.slider-value{
    color:#ff1744;
    font-weight:bold;
}

input[type="range"]{
    width:100%;
    accent-color:#ff1744;
    cursor:pointer;
}

/* SYSTEM */
.system-list{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.system-row{
    display:grid;
    grid-template-columns:75px 1fr 45px;
    align-items:center;
    gap:12px;
}

.system-name{
    font-size:11px;
    color:#aaa;
}

.bar{
    height:7px;
    background:#1b1b1b;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#ff1744;
    box-shadow:0 0 10px rgba(255,0,50,.5);
    border-radius:20px;
}

.percent{
    font-size:10px;
    color:#ff1744;
    text-align:right;
}

/* NETWORK */
.network-box{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.network-item{
    padding:15px 8px;
    text-align:center;
    border:1px solid #242424;
    background:#111;
    border-radius:7px;
}

.network-item span{
    display:block;
    color:#666;
    font-size:9px;
    margin-bottom:7px;
}

.network-item strong{
    font-size:15px;
}

/* ACTIONS */
.actions{
    margin-top:25px;
    display:flex;
    gap:12px;
}

.apply{
    flex:1;
    padding:16px;
    border:0;
    border-radius:7px;
    background:#ff1744;
    color:#fff;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,0,50,.2);
    transition:.25s;
}

.apply:hover{
    background:#ff3158;
    transform:translateY(-2px);
}

.reset{
    padding:16px 25px;
    border:1px solid #333;
    border-radius:7px;
    background:#111;
    color:#aaa;
    cursor:pointer;
}

.reset:hover{
    border-color:#ff1744;
    color:#fff;
}

/* TOAST */
.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#111;
    border:1px solid #ff1744;
    color:#fff;
    padding:14px 18px;
    border-radius:7px;
    font-size:12px;
    transform:translateY(100px);
    opacity:0;
    transition:.3s;
    z-index:10;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* FOOTER */
.footer{
    text-align:center;
    color:#444;
    font-size:10px;
    margin-top:35px;
}

/* MOBILE */
@media(max-width:800px){

    .header{
        padding:0 18px;
    }

    .status{
        display:none;
    }

    .container{
        padding:25px 15px 45px;
    }

    .title-area h1{
        font-size:27px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .profile-top{
        gap:15px;
        align-items:flex-start;
    }

    .profile-badge{
        display:none;
    }

    .options{
        grid-template-columns:repeat(2,1fr);
    }

    .modes{
        grid-template-columns:1fr;
    }

    .network-box{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

    .reset{
        width:100%;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        NO.S <span>×</span>
    </div>

    <div class="header-right">

        <div class="status">
            PERFORMANCE CENTER
        </div>

        <button class="back-btn"
        onclick="window.location.href='dashboard.html'">
            ← DASHBOARD
        </button>

    </div>

</header>


<main class="container">

    <section class="title-area">

        <h1>
            PERFORMANCE <span>CENTER</span>
        </h1>

        <p>
            Configure
